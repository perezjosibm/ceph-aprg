# =============================================================================
# prometheus/grafana-provisioning/datasources/prometheus.yml
#
# Auto-provisions the Prometheus data source in Grafana so no manual
# configuration step is needed after `docker compose up`.
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
